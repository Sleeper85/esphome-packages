globals:
  - id: ${inverter_id}_pv_energy_total_yesterday_global
    type: float
    restore_value: yes
  - id: ${inverter_id}_ac_output_energy_yesterday_global
    type: float
    restore_value: yes
  - id: ${inverter_id}_battery_charging_energy_yesterday_global
    type: float
    restore_value: yes
  - id: ${inverter_id}_battery_discharging_energy_yesterday_global
    type: float
    restore_value: yes

time:
  - platform: homeassistant #sntp
    id: !extend my_time
    on_time:
      - seconds: 59
        minutes: 59
        hours: 23
        then:
          - globals.set:
              id: ${inverter_id}_pv_energy_total_yesterday_global
              value: !lambda return ( id(${inverter_id}_pv_energy_total_yesterday_global) =  float( id(${inverter_id}_pv_energy_total_today).state) );
          - globals.set:
              id: ${inverter_id}_ac_output_energy_yesterday_global
              value: !lambda return ( id(${inverter_id}_ac_output_energy_yesterday_global) =  float( id(${inverter_id}_ac_output_energy_today).state) );
          - globals.set:
              id: ${inverter_id}_battery_charging_energy_yesterday_global
              value: !lambda return ( id(${inverter_id}_battery_charging_energy_yesterday_global) =  float( id(${inverter_id}_battery_charging_energy_today).state) );
          - globals.set:
              id: ${inverter_id}_battery_discharging_energy_yesterday_global
              value: !lambda return ( id(${inverter_id}_battery_discharging_energy_yesterday_global) =  float( id(${inverter_id}_battery_discharging_energy_today).state) );

sensor:

  - platform: template
    name: battery charging current
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_charging_current
    unit_of_measurement: 'A'
    accuracy_decimals: 2
    icon: mdi:current-dc
    device_class: current
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: |-
      if (id(${inverter_id}_battery_current).state >= 0)
        return (id(${inverter_id}_battery_current).state);
      else
        return 0.0;

  - platform: template
    name: battery discharging current
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_discharging_current
    unit_of_measurement: 'A'
    accuracy_decimals: 2
    icon: mdi:current-dc
    device_class: current
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: |-
      if (id(${inverter_id}_battery_current).state < 0)
        return ( - id(${inverter_id}_battery_current).state );
      else
        return 0.0;

  - platform: template
    name: battery charging power
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_charging_power
    unit_of_measurement: 'W'
    accuracy_decimals: 2
    device_class: power
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: return ( (id(${inverter_id}_battery_voltage).state) * (id(${inverter_id}_battery_charging_current).state) );

  - platform: template
    name: battery discharging power
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_discharging_power
    unit_of_measurement: 'W'
    accuracy_decimals: 2
    device_class: power
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: return ( (id(${inverter_id}_battery_voltage).state) * (id(${inverter_id}_battery_discharging_current).state) );

  # Sum of PV1 and PV2 to get total PV Power
  - platform: template
    name: pv power total
    device_id: ${inverter_id}
    id: ${inverter_id}_pv_power_total
    unit_of_measurement: 'W'
    accuracy_decimals: 2
    device_class: power
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: return (id(${inverter_id}_pv1_power).state + id(${inverter_id}_pv2_power).state);

  # +--------------------------------------+
  # |           Yesterday Power            |
  # +--------------------------------------+
  - platform: template
    name: battery charging energy yesterday
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_charging_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: measurement
    lambda: return id(${inverter_id}_battery_charging_energy_yesterday_global);

  - platform: template
    name: battery discharging energy yesterday
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_discharging_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: measurement
    lambda: return id(${inverter_id}_battery_discharging_energy_yesterday_global);

  - platform: template
    name: pv energy total yesterday
    device_id: ${inverter_id}
    id: ${inverter_id}_pv_energy_total_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: measurement
    lambda: return id(${inverter_id}_pv_energy_total_yesterday_global);

  - platform: template
    name: ac output energy yesterday
    device_id: ${inverter_id}
    id: ${inverter_id}_ac_output_energy_yesterday
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: return id(${inverter_id}_ac_output_energy_yesterday_global);

  # +---------------------------------------+
  # |    Essential & Non-essential Power    |
  # +---------------------------------------+
  - platform: template           # Essential Power based on register 175 + 167(LD) - 166
    name: essential power
    device_id: ${inverter_id}
    unit_of_measurement: 'W'
    accuracy_decimals: 2
    device_class: power
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: return (id(${inverter_id}_ac_output_power).state + id(${inverter_id}_grid_power_limiter_1).state - id(${inverter_id}_aux_output_power).state);

  - platform: template           # Non-essential Power 172 - 167(LD)
    name: non-essential power
    device_id: ${inverter_id}
    unit_of_measurement: 'W'
    accuracy_decimals: 2
    device_class: power
    state_class: measurement
    update_interval: ${inverter_update_interval}
    lambda: return (id(${inverter_id}_grid_external_power_total).state - id(${inverter_id}_grid_power_limiter_1).state);

  # +--------------------------------------+
  # |         Total Daily Energy           |
  # +--------------------------------------+
  - platform: total_daily_energy
    name: pv energy total today
    device_id: ${inverter_id}
    id: ${inverter_id}_pv_energy_total_today
    power_id: ${inverter_id}_pv_power_total
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: measurement
    method: trapezoid
    filters:
       # Multiplication factor from W to kW is 0.001
       - multiply: 0.001

  - platform: total_daily_energy
    name: ac output energy today
    device_id: ${inverter_id}
    id: ${inverter_id}_ac_output_energy_today
    power_id: ${inverter_id}_ac_output_power
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: measurement
    method: trapezoid
    filters:
       # Multiplication factor from W to kW is 0.001
       - multiply: 0.001
