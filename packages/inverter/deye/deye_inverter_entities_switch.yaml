# +--------------------------------------+
# |              Switch                  |
# +--------------------------------------+
switch:

  - platform: modbus_controller            # 28 Low Power mode
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: low power mode
    device_id: ${inverter_id}
    id: ${inverter_id}_low_power_mode
    register_type: holding
    address: 28
    bitmask: 0x04
    icon: mdi:toggle-switch
    entity_category: config

  - platform: modbus_controller            # 28 MPPT Multi-Point Scanning
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: mppt multipoint scanning
    device_id: ${inverter_id}
    id: ${inverter_id}_mppt_multipoint_scanning
    register_type: holding
    address: 28
    bitmask: 0x20
    icon: mdi:toggle-switch
    entity_category: config

  - platform: modbus_controller            # 34 Low Noise mode
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: low noise mode
    device_id: ${inverter_id}
    id: ${inverter_id}_low_noise_mode
    register_type: holding
    address: 34
    bitmask: 0x01
    icon: mdi:toggle-switch
    entity_category: config

  - platform: modbus_controller            # 247 Solar Sell
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: solar sell
    device_id: ${inverter_id}
    id: ${inverter_id}_solar_sell
    register_type: holding
    address: 247
    bitmask: 0x01
    icon: mdi:toggle-switch
    entity_category: config

  - platform: modbus_controller            # 248 Time Of Use
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: time of use
    device_id: ${inverter_id}
    id: ${inverter_id}_time_of_use
    register_type: holding
    address: 248
    bitmask: 0x01
    icon: mdi:toggle-switch
    entity_category: config

  - platform: modbus_controller            # 326 Force Generator
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: force generator
    device_id: ${inverter_id}
    id: ${inverter_id}_force_generator
    register_type: holding
    address: 326
    bitmask: 0x2000 # 2^13=8192 to target bit 13
    icon: mdi:toggle-switch
    entity_category: config
