  - platform: modbus_controller            # 210 Battery Max Charge Current
    use_write_multiple: true
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: battery max charge current
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_max_charge_current_number
    unit_of_measurement: 'A'
    icon: mdi:current-dc
    address: 210
    value_type: U_WORD
    reuse_previous_range: true # spans unused 204-209 (BOTH 210 entities must match)
    min_value: 5
    max_value: 185
    step: 5
    mode: ${inverter_input_number_mode}
    entity_category: config

