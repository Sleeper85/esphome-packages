# +--------------------------------------+
# |              Number                  |
# +--------------------------------------+
number:

  - platform: template                     # 201 Battery Equalization Voltage
    name: battery equalization voltage
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_equalization_voltage_number
    unit_of_measurement: 'V'
    optimistic: true
    icon: mdi:sine-wave
    min_value: 50.00
    max_value: 61.00
    step: 0.1
    initial_value: ${inverter_equalization_voltage}
    restore_value: true
    mode: ${inverter_input_number_mode}
    entity_category: config
    on_value:
      then:
        - modbus_client.write_multiple_registers:
            modbus_id: ${inverter_modbus_id}
            address: ${inverter_modbus_address}
            start_address: 201
            values: !lambda |-
              std::vector<uint16_t> battery_settings(1);
              battery_settings[0]  = uint16_t(  (id(${inverter_id}_battery_equalization_voltage_number).state)*100 );
              return battery_settings;

