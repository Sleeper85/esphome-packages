# +--------------------------------------+
# |           Binary Sensor              |
# +--------------------------------------+
binary_sensor:

  - platform: modbus_controller            # 28 MPPT Multi-Point Scanning
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: mppt multipoint scanning
    device_id: ${inverter_id}
    register_type: holding
    address: 28
    bitmask: 0x20

  # - platform: modbus_controller            # 43 Switch on/off enable
  #   modbus_controller_id: ${inverter_id}_modbus_controller
  #   name: switch on and off enable
  #   device_id: ${inverter_id}
  #   id: ${inverter_id}_switch_on_and_off_enable
  #   register_type: holding
  #   address: 43

  - platform: modbus_controller            # 46 Istland Protection Mode
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: island protection mode
    device_id: ${inverter_id}
    id: ${inverter_id}_island_protection_mode
    register_type: holding
    address: 46

  - platform: modbus_controller            # 47 MPPT number
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: mppt number
    device_id: ${inverter_id}
    id: ${inverter_id}_mppt_number
    register_type: holding
    address: 47

  - platform: modbus_controller            # 48 GFDI mode
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: GFDI mode
    device_id: ${inverter_id}
    id: ${inverter_id}_GFDI_mode
    register_type: holding
    address: 48

  - platform: modbus_controller            # 194 Grid Relay Status
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: grid relay status
    device_id: ${inverter_id}
    id: ${inverter_id}_grid_relay_status
    register_type: holding
    address: 194

# +--------------------------------------+
# |              Sensor                  |
# +--------------------------------------+

# Reading max 128 consecutive registers !

sensor:

  - platform: modbus_controller            # 37/01 Modbus address
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: modbus address
    device_id: ${inverter_id}
    id: ${inverter_id}_modbus_address
    register_type: holding
    address: 37
    value_type: U_WORD
    filters:
      - offset: 1

  # BATTERY

  - platform: modbus_controller            # 070 Battery Charge Day
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: battery charging energy today
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_charging_energy_today
    register_type: holding
    address: 70
    value_type: U_WORD
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 071 Battery Discharge Day
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: battery discharging energy today
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_discharging_energy_today
    register_type: holding
    address: 71
    value_type: U_WORD
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 072 Battery Charge Energy Total
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: battery charging total
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_charging_total
    register_type: holding
    address: 72
    value_type: U_DWORD_R
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
     - multiply: 0.1

  - platform: modbus_controller            # 074 Battery Discharge Energy Total
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: battery discharging total
    device_id: ${inverter_id}
    id: ${inverter_id}_battery_discharging_total
    register_type: holding
    address: 74
    value_type: U_DWORD_R
    unit_of_measurement: 'kWh'
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing
    filters:
     - multiply: 0.1

  # GRID

  - platform: modbus_controller            # 076 Grid Import Day (Buy)
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: grid energy imported today
    device_id: ${inverter_id}
    id: ${inverter_id}_grid_energy_imported_today
    register_type: holding
    address: 76
    value_type: U_WORD
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 077 Day Grid Export
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: grid energy exported today
