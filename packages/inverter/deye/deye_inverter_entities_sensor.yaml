# +--------------------------------------+
# |             Text Sensor              |
# +--------------------------------------+
text_sensor:

  - platform: modbus_controller            # 059 Overall State
    modbus_controller_id: ${inverter_id}_modbus_controller
    name: overall state
    device_id: ${inverter_id}
    id: ${inverter_id}_overall_state
    register_type: holding
    raw_encode: HEXBYTES
    address: 59
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value)
      {
        case 0: return std::string("standby");
        case 1: return std::string("selftest");
        case 2: return std::string("normal");
        case 3: return std::string("alarm");
        case 4: return std::string("fault");
        default: return std::string("unknown");
      }
