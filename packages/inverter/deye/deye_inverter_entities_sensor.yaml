    reuse_previous_range: true # spans unused 87-89
    unit_of_measurement: '°C'
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - offset: -1000
      - multiply:  0.1

  - platform: modbus_controller            # 091 Radiator Temperature
