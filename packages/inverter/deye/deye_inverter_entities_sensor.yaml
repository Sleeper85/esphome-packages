    address: 77
    value_type: U_WORD
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 078 Grid Import Energy Total (Buy)
