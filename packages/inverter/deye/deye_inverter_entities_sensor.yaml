    name: grid energy imported total
    device_id: ${inverter_id}
    id: ${inverter_id}_grid_energy_imported_total
    register_type: holding
    address: 78
    value_type: U_WORD
    unit_of_measurement: 'kWh'
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 079 Grid Frequency
