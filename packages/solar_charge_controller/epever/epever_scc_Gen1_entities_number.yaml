    min_value: 10.00
    max_value: 60.00
    step:  0.1
    initial_value: ${scc_overvoltage_disconnect_voltage}
    restore_value: true
    mode: ${scc_input_number_mode}
    on_value:
      then:       
        - script.execute: ${scc_id}_write_0x9003_to_0x900E_registers

