# +--------------------------------------+
# |              Script                  |
# +--------------------------------------+
# It's necessary to modify the following registers '0x9003 to 0x900E' at the same time.

script:
  - id: ${scc_id}_write_0x9003_to_0x900E_registers
    mode: restart
    then:
      # Debounce: the 12 values restored at boot, or several changes in a row, give one single write
      - delay: 2s
      # Never write while one of the 12 values is unknown (NaN would be written as garbage)
      - if:
          condition:
            lambda: |-
              return !std::isnan(id(${scc_id}_overvoltage_disconnect_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_charging_limit_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_overvoltage_reconnect_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_equalization_charging_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_boost_charging_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_float_charging_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_boost_reconnect_charging_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_low_voltage_reconnect_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_undervoltage_alarm_recovery_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_undervoltage_alarm_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_low_voltage_disconnect_voltage_number).state) &&
                     !std::isnan(id(${scc_id}_discharging_limit_voltage_number).state);
          then:
            - modbus_client.write_multiple_registers:
                modbus_id: ${scc_modbus_id}
                address: ${scc_modbus_address}
                start_address: 0x9003
                values: !lambda |-
                  std::vector<uint16_t> battery_settings(12);
                  battery_settings[0]  = uint16_t(roundf(id(${scc_id}_overvoltage_disconnect_voltage_number).state * 100));  // 0x9003
                  battery_settings[1]  = uint16_t(roundf(id(${scc_id}_charging_limit_voltage_number).state * 100));  // 0x9004
                  battery_settings[2]  = uint16_t(roundf(id(${scc_id}_overvoltage_reconnect_voltage_number).state * 100));  // 0x9005
                  battery_settings[3]  = uint16_t(roundf(id(${scc_id}_equalization_charging_voltage_number).state * 100));  // 0x9006
                  battery_settings[4]  = uint16_t(roundf(id(${scc_id}_boost_charging_voltage_number).state * 100));  // 0x9007
                  battery_settings[5]  = uint16_t(roundf(id(${scc_id}_float_charging_voltage_number).state * 100));  // 0x9008
                  battery_settings[6]  = uint16_t(roundf(id(${scc_id}_boost_reconnect_charging_voltage_number).state * 100));  // 0x9009
                  battery_settings[7]  = uint16_t(roundf(id(${scc_id}_low_voltage_reconnect_voltage_number).state * 100));  // 0x900A
                  battery_settings[8]  = uint16_t(roundf(id(${scc_id}_undervoltage_alarm_recovery_voltage_number).state * 100));  // 0x900B
                  battery_settings[9]  = uint16_t(roundf(id(${scc_id}_undervoltage_alarm_voltage_number).state * 100));  // 0x900C
                  battery_settings[10] = uint16_t(roundf(id(${scc_id}_low_voltage_disconnect_voltage_number).state * 100));  // 0x900D
                  battery_settings[11] = uint16_t(roundf(id(${scc_id}_discharging_limit_voltage_number).state * 100));  // 0x900E
                  return battery_settings;

# +--------------------------------------+
# |              Number                  |
# +--------------------------------------+
number:

  # B5
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    id: ${scc_id}_battery_capacity_number
    name: Battery Capacity Number
    device_id: ${scc_id}
    address: 0x9001
    value_type: U_WORD
    use_write_multiple: true
    unit_of_measurement: 'Ah'
    icon: mdi:car-battery
    entity_category: config
    min_value: 50
    max_value: 1000
    step:  10
    mode: ${scc_input_number_mode}

  # B6
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    id: ${scc_id}_temperature_compensation_coefficient_number
    name: Temperature Compensation Coefficient Number
    device_id: ${scc_id}
    address: 0x9002
    value_type: U_WORD
    use_write_multiple: true
    unit_of_measurement: "mV/°C/2V"
    icon: mdi:thermometer
    entity_category: config
    min_value: -10
    max_value: 0
    step:  1
    multiply: -100
    mode: ${scc_input_number_mode}

  # B21
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    id: ${scc_id}_equalization_duration_number
