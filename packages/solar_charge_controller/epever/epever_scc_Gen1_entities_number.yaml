  # +--------------------------------------+
  # |             Template                 |
  # +--------------------------------------+
  
  # B7 0x9003
  - platform: template
    id: ${scc_id}_overvoltage_disconnect_voltage_number
    name: Overvoltage Disconnect Voltage Number
