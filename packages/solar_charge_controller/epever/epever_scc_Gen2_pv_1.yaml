# EPEVER solar charge controller - Gen2 (ET-NC, IT-NC, TES, TIS series)
# PV1 input. Loaded by epever_scc_Gen2_full.yaml when `scc_pv_input` = 1, and by
# epever_scc_Gen2_pv_2.yaml when `scc_pv_input` = 2.
# Register map: documents/Epever_Modbus_ET-NC_IT-NC_TES_TIS_Series_Solar_Charge_Controller_Protocol_V1.00.md

# +--------------------------------------+
# | Binary Sensor                        |
# +--------------------------------------+
binary_sensor:

  # 0x3202 | D0 | PV1 status: 1 running, 0 standby
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Running"
    device_id: ${scc_id}
    entity_category: diagnostic
    device_class: running
    register_type: read
    address: 0x3202
    bitmask: 0x0001

  # 0x3202 | D1 | Day / night: 0 day, 1 night
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "Night"
    device_id: ${scc_id}
    entity_category: diagnostic
    register_type: read
    address: 0x3202
    bitmask: 0x0002

  # 0x3202 | D4 | PV1 Or Battery Reverse Connection
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Or Battery Reverse Connection"
    device_id: ${scc_id}
    entity_category: diagnostic
    device_class: problem
    register_type: read
    address: 0x3202
    bitmask: 0x0010

  # 0x3202 | D5 | Device Over Temperature
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "Device Over Temperature"
    device_id: ${scc_id}
    entity_category: diagnostic
    device_class: problem
    register_type: read
    address: 0x3202
    bitmask: 0x0020

  # 0x3202 | D13-D10 | Phase 1 to 4 charging MOSFET short circuit
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "Charging MOSFET Short Circuit"
    device_id: ${scc_id}
    entity_category: diagnostic
    device_class: problem
    register_type: read
    address: 0x3202
    bitmask: 0x3C00

  # 0x3202 | D15-D14 | PV1 input voltage status: 00 normal, 02H too high
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Input Voltage Too High"
    device_id: ${scc_id}
    entity_category: diagnostic
    device_class: problem
    register_type: read
    address: 0x3202
    bitmask: 0x8000

# +--------------------------------------+
# | Sensor                               |
# +--------------------------------------+
sensor:

  # 0x3100 | PV1 input voltage
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Input Voltage"
    device_id: ${scc_id}
    register_type: read
    address: 0x3100
    value_type: U_WORD
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # 0x3101 | PV1 input current
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Input Current"
    device_id: ${scc_id}
    register_type: read
    address: 0x3101
    value_type: U_WORD
    device_class: current
    state_class: measurement
    unit_of_measurement: "A"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # 0x3102 + 0x3103 | PV1 input power (L, H)
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Input Power"
    device_id: ${scc_id}
    register_type: read
    address: 0x3102
    value_type: U_DWORD_R
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  # 0x3104 | PV1 output voltage (output of the MPPT stage)
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Output Voltage"
    device_id: ${scc_id}
    register_type: read
    address: 0x3104
    value_type: U_WORD
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # 0x3105 | PV1 output current
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Output Current"
    device_id: ${scc_id}
    register_type: read
    address: 0x3105
    value_type: U_WORD
    device_class: current
    state_class: measurement
    unit_of_measurement: "A"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # 0x3106 + 0x3107 | PV1 output power (L, H)
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV1 Output Power"
    device_id: ${scc_id}
    register_type: read
    address: 0x3106
    value_type: U_DWORD_R
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  # 0x3202 | Charging status 1 (PV1)
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    id: ${scc_id}_charging_status_1_raw
    internal: true
    register_type: read
    address: 0x3202
    value_type: U_WORD
    on_value:
      then:
        # 0x3202 | D3-D2 | Charging stage
        - text_sensor.template.publish:
            id: ${scc_id}_charging_phase
            state: !lambda |-
              switch ((int(x) >> 2) & 0x0003) {
                case 0: return "Not Charging";
                case 1: return "Float";
                case 2: return "Boost";
                case 3: return "Equalization";
                default: return "Unknown";
              }

# +--------------------------------------+
# | Text Sensor                          |
# +--------------------------------------+
text_sensor:

  - platform: template
    id: ${scc_id}_charging_phase
    name: "Charging Phase"
    device_id: ${scc_id}
