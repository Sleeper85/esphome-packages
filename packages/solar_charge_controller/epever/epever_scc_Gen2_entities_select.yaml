# EPEVER solar charge controller - Gen2 (ET-NC, IT-NC, TES, TIS series)
# Settings with a list of values, common to the 4 series (Modbus function code 0x10 for all writes).
# Register map: documents/Epever_Modbus_ET-NC_IT-NC_TES_TIS_Series_Solar_Charge_Controller_Protocol_V1.00.md

# +--------------------------------------+
# | Select                               |
# +--------------------------------------+
select:

  # 0x9038 | Charging and discharging mode: 0 Voltage, 1 SOC
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "Charging Discharging Mode"
    device_id: ${scc_id}
    entity_category: config
    icon: mdi:battery-sync
    address: 0x9038
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "Voltage": 0
      "SOC": 1

  # 0x9041 | Use BMS settings: the 12 charging voltages and the current limits follow the BMS
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "Use BMS Settings"
    device_id: ${scc_id}
    entity_category: config
    icon: mdi:battery-check
    address: 0x9041
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "Disable": 0
      "Enable": 1

  # 0x9042 | PV connection mode: 0 independent inputs, 1 centralized (parallel) input. Single PV models: independent
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "PV Connection Mode"
    device_id: ${scc_id}
    entity_category: config
    icon: mdi:solar-panel
    address: 0x9042
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "Independent": 0
      "Centralized": 1

  # 0x9043 | Simulate BMS mode: end of charge current limiting (MAP table)
  - platform: modbus_controller
    modbus_controller_id: ${scc_id}_modbus_controller
    name: "Simulate BMS Mode"
    device_id: ${scc_id}
    entity_category: config
    icon: mdi:battery-heart-variant
    address: 0x9043
    value_type: U_WORD
    use_write_multiple: true
    optionsmap:
      "Disable": 0
      "Enable": 1
