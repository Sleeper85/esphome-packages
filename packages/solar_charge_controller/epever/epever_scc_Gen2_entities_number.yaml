    step: 10
    mode: ${scc_input_number_mode}

  # +--------------------------------------+
  # | Voltage parameters (0x9007 - 0x9012) |
  # +--------------------------------------+
  # Range 9.00 to 17.00 V x N (N = 1 for 12V, 2 for 24V, 3 for 36V, 4 for 48V)

  # 0x9007
  - platform: template
    id: ${scc_id}_overvoltage_disconnect_voltage_number
    name: "Overvoltage Disconnect Voltage Number"
    device_id: ${scc_id}
    entity_category: config
    unit_of_measurement: "V"
    icon: mdi:sine-wave
    optimistic: true
    min_value: 9.0
    max_value: 68.0
    step: 0.1
    initial_value: ${scc_overvoltage_disconnect_voltage}
    restore_value: true
    mode: ${scc_input_number_mode}
    on_value:
      then:
        - script.execute: ${scc_id}_write_0x9007_to_0x9012_registers

