# +--------------------------------------+
# | Sub-device                           |
# +--------------------------------------+
# All entities of this package are attached to this sub-device in Home Assistant.
esphome:
  devices:
    - id: ${scc_id}
      name: "${scc_name}"
      relation: via

  on_boot:
    # IMPORTANT: the list form (- priority:) is required so this trigger MERGES with
    # on_boot triggers declared by other packages (e.g. YamBMS device_base.yaml).
    # The dict form ("on_boot: / then:") silently overrides them.
    - priority: -100.0
      then:
        - script.execute: ${scc_id}_write_E005_E00E_registers_script
    
time:
  - platform: sntp # homeassistant
    id: !extend my_time
    on_time:
      - seconds: ${my_second}
        minutes: ${my_minute}
        hours: ${my_hours}
        then:  
          - globals.set:
              id: ${scc_id}_pv_energy_yesterday_global
              value: !lambda return ( id(${scc_id}_pv_energy_yesterday_global) =  float( id(${scc_id}_pv_energy_today).state) );         
                
          - globals.set:
              id: ${scc_id}_battery_charging_energy_yesterday_global
              value: !lambda return ( id(${scc_id}_battery_charging_energy_yesterday_global) =  float( id(${scc_id}_battery_charging_energy_today).state) );        

globals:
  - id: ${scc_id}_battery_coefficient
    type: int
    restore_value: yes

  - id: ${scc_id}_battery_reco_global
    type: int

  - id: ${scc_id}_current_load_charging_mode_global
    type: int  

  - id: ${scc_id}_pv_energy_yesterday_global
    type: float
    restore_value: yes
    
  - id: ${scc_id}_battery_charging_energy_yesterday_global
    type: float
    restore_value: yes
   
modbus_controller:
  - id: ${scc_id}_modbus_controller
    address: ${scc_modbus_address}
    modbus_id: ${scc_modbus_id} #${scc_id}_modbus
    setup_priority: -10
    update_interval: ${scc_update_interval}
    max_cmd_retries: 1        # default 4: a dead device would block the bus much longer
    offline_skip_updates: 5   # re-probe every (5+1) x update_interval
    
