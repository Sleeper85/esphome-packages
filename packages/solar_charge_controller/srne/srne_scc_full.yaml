  - id: ${scc_id}_update_template_numbers_script
    then:
      - lambda: |-
            id(${scc_id}_over_voltage_threshold_number).traits.set_min_value(14*id(${scc_id}_battery_coefficient));
            id(${scc_id}_over_voltage_threshold_number).traits.set_max_value(16*id(${scc_id}_battery_coefficient));
            id(${scc_id}_over_voltage_threshold_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));
            
            id(${scc_id}_charging_voltage_limit_number).traits.set_min_value(14*id(${scc_id}_battery_coefficient));
            id(${scc_id}_charging_voltage_limit_number).traits.set_max_value(15.5*id(${scc_id}_battery_coefficient));
            id(${scc_id}_charging_voltage_limit_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_equalizing_charge_voltage_number).traits.set_min_value(12*id(${scc_id}_battery_coefficient));
            id(${scc_id}_equalizing_charge_voltage_number).traits.set_max_value(14.5*id(${scc_id}_battery_coefficient));
            id(${scc_id}_equalizing_charge_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_boost_voltage_number).traits.set_min_value(12*id(${scc_id}_battery_coefficient));
            id(${scc_id}_boost_voltage_number).traits.set_max_value(14.5*id(${scc_id}_battery_coefficient));
            id(${scc_id}_boost_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_float_voltage_number).traits.set_min_value(12*id(${scc_id}_battery_coefficient));
            id(${scc_id}_float_voltage_number).traits.set_max_value(14.5*id(${scc_id}_battery_coefficient));
            id(${scc_id}_float_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_boost_charging_recovery_voltage_number).traits.set_min_value(12*id(${scc_id}_battery_coefficient));
            id(${scc_id}_boost_charging_recovery_voltage_number).traits.set_max_value(14.5*id(${scc_id}_battery_coefficient));
            id(${scc_id}_boost_charging_recovery_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_over_discharge_recovery_voltage_number).traits.set_min_value(11*id(${scc_id}_battery_coefficient));
            id(${scc_id}_over_discharge_recovery_voltage_number).traits.set_max_value(13*id(${scc_id}_battery_coefficient));
            id(${scc_id}_over_discharge_recovery_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_under_voltage_warning_number).traits.set_min_value(11*id(${scc_id}_battery_coefficient));
            id(${scc_id}_under_voltage_warning_number).traits.set_max_value(12.6*id(${scc_id}_battery_coefficient));
            id(${scc_id}_under_voltage_warning_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_over_discharge_voltage_number).traits.set_min_value(10*id(${scc_id}_battery_coefficient));
            id(${scc_id}_over_discharge_voltage_number).traits.set_max_value(12*id(${scc_id}_battery_coefficient));
            id(${scc_id}_over_discharge_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

            id(${scc_id}_discharge_limit_voltage_number).traits.set_min_value(9.8*id(${scc_id}_battery_coefficient));
            id(${scc_id}_discharge_limit_voltage_number).traits.set_max_value(12*id(${scc_id}_battery_coefficient));
            id(${scc_id}_discharge_limit_voltage_number).traits.set_step(0.1*id(${scc_id}_battery_coefficient));

      - number.set:
          id: ${scc_id}_over_voltage_threshold_number
          value: !lambda |- 
              return float(id(${scc_id}_over_voltage_threshold_number).state*id(${scc_id}_battery_coefficient));
      - number.set:
          id: ${scc_id}_charging_voltage_limit_number
          value: !lambda |- 
              return float(id(${scc_id}_charging_voltage_limit_number).state*id(${scc_id}_battery_coefficient));
      - number.set:
          id: ${scc_id}_equalizing_charge_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_equalizing_charge_voltage_number).state*id(${scc_id}_battery_coefficient));                
      - number.set:
          id: ${scc_id}_boost_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_boost_voltage_number).state*id(${scc_id}_battery_coefficient)); 
      - number.set:
          id: ${scc_id}_float_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_float_voltage_number).state*id(${scc_id}_battery_coefficient));
      - number.set:
          id: ${scc_id}_boost_charging_recovery_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_boost_charging_recovery_voltage_number).state*id(${scc_id}_battery_coefficient));
      - number.set:
          id: ${scc_id}_over_discharge_recovery_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_over_discharge_recovery_voltage_number).state*id(${scc_id}_battery_coefficient));                           
      - number.set:
          id: ${scc_id}_under_voltage_warning_number
          value: !lambda |- 
              return float(id(${scc_id}_under_voltage_warning_number).state*id(${scc_id}_battery_coefficient));
      - number.set:
          id: ${scc_id}_over_discharge_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_over_discharge_voltage_number).state*id(${scc_id}_battery_coefficient));
      - number.set:
          id: ${scc_id}_discharge_limit_voltage_number
          value: !lambda |- 
              return float(id(${scc_id}_discharge_limit_voltage_number).state*id(${scc_id}_battery_coefficient));                

  - id: ${scc_id}_write_E003_register_script
    # parameters:
    #   current_controller: "esphome::modbus_controller::ModbusController *"
    then:
      - modbus_client.write_multiple_registers:
          modbus_id: ${scc_modbus_id}
          address: ${scc_modbus_address}
          start_address: 0xE003
          values: !lambda |-
            std::vector<uint16_t> battery_settings(1);
            battery_settings[0]  = uint16_t( 3072*id(${scc_id}_battery_coefficient)  + id(${scc_id}_battery_reco_global));
            //ESP_LOGD("script","value to be written in E003 = %d",battery_settings[0]);
            return battery_settings;

 
  - id: ${scc_id}_write_E005_E00E_registers_script
    then:
      - modbus_client.write_multiple_registers:
          modbus_id: ${scc_modbus_id}
          address: ${scc_modbus_address}
          start_address: 0xE005
          values: !lambda |-
            std::vector<uint16_t> battery_settings(10);
            battery_settings[0]  = uint16_t(( (id(${scc_id}_over_voltage_threshold_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[1]  = uint16_t(( (id(${scc_id}_charging_voltage_limit_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[2]  = uint16_t(( (id(${scc_id}_equalizing_charge_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[3]  = uint16_t(( (id(${scc_id}_boost_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[4]  = uint16_t(( (id(${scc_id}_float_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[5]  = uint16_t(( (id(${scc_id}_boost_charging_recovery_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[6]  = uint16_t(( (id(${scc_id}_over_discharge_recovery_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[7]  = uint16_t(( (id(${scc_id}_under_voltage_warning_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[8]  = uint16_t(( (id(${scc_id}_over_discharge_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            battery_settings[9]  = uint16_t(( (id(${scc_id}_discharge_limit_voltage_number).state)*10)/id(${scc_id}_battery_coefficient) );
            return battery_settings;
