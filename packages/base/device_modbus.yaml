# The settings below can be changed via `vars` when importing the package
# or by declaring new `substitutions` in the main YAML.
substitutions:
  # Modbus
  modbus_send_wait_time: '2000ms'    # time in milliseconds before the next ModBUS command is sent if an answer from a previous command is pending (default value from ESPHome PR #11969)

uart:
  - id: !extend ${modbus_uart_id}
    baud_rate: ${modbus_baud_rate}

modbus:
  - uart_id: ${modbus_uart_id}
    id: ${modbus_id}
    role: ${modbus_role}
    send_wait_time: ${modbus_send_wait_time}
