################################################################################

# If needed, configure a static IP here
# wifi:
#   manual_ip:
#     static_ip: 192.168.0.85
#     gateway: 192.168.0.1
#     subnet: 255.255.255.0
#     dns1: 8.8.8.8
#     dns2: 8.8.4.4

logger:
  level: INFO # VERBOSE / DEBUG / INFO / WARN

ota:
  platform: esphome
  
# Please use the native `api` component instead of the `mqtt` section.
# If you use Home Assistant, the native API is more lightweight.
# If there is no HA server connected to this API, the ESP32 reboots every 15 minutes to try to resolve the problem.
# The "reboot_timeout: 0s" option will keep your ESP32 up and running even if you lose connection to your HA server.
api:
  reboot_timeout: 0s

# If you don't want to use ESPHome's native API you can use MQTT instead.
# In this case don't forget to remove the 'api:' section.
# mqtt:
#   broker: !secret mqtt_host
#   username: !secret mqtt_username
#   password: !secret mqtt_password
#   id: mqtt_client

# Please note that enabling this component will take up a lot of memory and may decrease
# stability and be the cause of reboot depending on the capabilities of the board used.
# web_server:
#   port: 80
#   log: false
#   ota: false

# +--------------------------------------+
# | Global Settings                      |
# +--------------------------------------+
substitutions:
  # Name
  hostname: 'deye-node' # This is the name of the ESP32 node. It should always be unique in your ESPHome network.
  friendly_name : 'Deye' # Name of the ESP32 node in Home Assistant. Each package adds its own sub-device under it.

# +--------------------------------------+
# | Packages                             |
# +--------------------------------------+
packages:
  remote_packages:
    url: https://github.com/Sleeper85/esphome-packages
    ref: main
    refresh: 0s
    files:

  # +------------------------------------------------------------------------------+
  # | >>> UNCOMMENT YOUR BOARD
  # | >>> ONLY ONE BOARD !
  # +------------------------------------------------------------------------------+

      - path: 'packages/board/board_ESP32_Generic.yaml'
      # - path: 'packages/board/board_ESP32_Atom-Lite.yaml'
      # - path: 'packages/board/board_ESP32_DevKit-V1.yaml'
      # - path: 'packages/board/board_ESP32_EVB.yaml'
      # - path: 'packages/board/board_ESP32_iBMS_CAN_RS485_V3.3.yaml'
      # - path: 'packages/board/board_ESP32_LilyGo-T-CAN485.yaml'
      # - path: 'packages/board/board_ESP32-C3_DevKitM-1.yaml'
      # - path: 'packages/board/board_ESP32-C3_ETH01-EVO.yaml'
      # - path: 'packages/board/board_ESP32-C3_FlipC3.yaml'
      # - path: 'packages/board/board_ESP32-S3_Generic.yaml'
      # - path: 'packages/board/board_ESP32-S3_AtomS3-Lite.yaml'
      # - path: 'packages/board/board_ESP32-S3_AtomS3.yaml'
      # - path: 'packages/board/board_ESP32-S3_AtomS3R.yaml'
      # - path: 'packages/board/board_ESP32-S3_DevKitC-1_LED-38.yaml'
      # - path: 'packages/board/board_ESP32-S3_DevKitC-1_LED-48.yaml'
      # - path: 'packages/board/board_ESP32-S3_LilyGo-T-Connect.yaml'
      # - path: 'packages/board/board_ESP32-S3_LilyGo-T-Connect-Pro.yaml'
      # - path: 'packages/board/board_ESP32-S3_WS-ETH.yaml'
      # - path: 'packages/board/board_ESP32-S3_WS-RS485-CAN.yaml'
      # - path: 'packages/board/board_ESP32-S3_WS-Touch-LCD-4.3.yaml'
      # - path: 'packages/board/board_ESP32-S3_WS-Touch-LCD-7.yaml'
      # - path: 'packages/board/board_ESP32-S3_XIAO.yaml'
      # - path: 'packages/board/board_ESP32-S3_YBoard.yaml'



  # +------------------------------------------------------------------------------+
  # | >>> Board Options
  # | >>> Uncomment your interfaces and options
  # +------------------------------------------------------------------------------+

      # PSRAM octal 80Mhz
      # - path: 'packages/board/board_options_PSRAM_octal_80Mhz.yaml'

      # WiFi AP @ 192.168.4.1
      # - path: 'packages/board/board_options_wifi_ap.yaml'

      # Captive Portal @ 192.168.4.1
      # - path: 'packages/board/board_options_captive_portal.yaml'



  # +------------------------------------------------------------------------------+
  # | >>> Devices packages
  # +------------------------------------------------------------------------------+

      # Modbus : the UART named by `modbus_uart_id` is declared by this package
      - path: 'packages/board/board_options_itf_modbus.yaml'
        vars:
          modbus_id: 'deye' # full id = modbus_client_deye
          modbus_role: 'client' # client / server
          modbus_uart_id: 'uart_esp_1' # uart_esp_1 / uart_esp_2 / uart_esp_3
          modbus_baud_rate: '9600' # 9600 / 19200 / 115200
          modbus_send_wait_time: '500ms' # max time to wait for the first byte of a response
          modbus_turnaround_time: '50ms' # pause after a response before the next command
          # uart_flow_control_pin: ${talk_pin} # only if your RS485 transceiver needs a flow control pin

      # Deye
      - path: 'packages/inverter/deye/deye_inverter_full.yaml' # standard / full
        vars:
          inverter_id: 'inverter_1' # ID (no space), prefix of all IDs of this package
          inverter_name: 'Inverter 1' # Name of the sub-device in Home Assistant
          inverter_modbus_id: 'modbus_client_deye'
          inverter_modbus_address: '1'
          inverter_update_interval: '5s'
          inverter_input_number_mode: 'box' # box / slider
          inverter_equalization_voltage: '53.6' # initial value
          inverter_absorption_voltage: '55.2' # initial value
          inverter_float_voltage: '53.6' # initial value



  # +------------------------------------------------------------------------------+
  # | >>> DEBUG
  # +------------------------------------------------------------------------------+

      - path: packages/base/device_debug_ESP32.yaml
      # - path: packages/base/device_debug_ESP32_PSRAM.yaml
        vars:
          debug_name: 'Debug'
          debug_update_interval: '5s'
          # Size of your PSRAM in bits
          # 8Mb='8388608' | 6Mb='6291456' | 4Mb='4194304' | 2Mb='2097152' | NoPSRAM='0'
          debug_psram_size: '8388608'